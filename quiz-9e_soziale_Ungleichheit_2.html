// ════════════════════════════════════════════════════════════
const NOTEN = {
  mittel: [ [96,1],[80,2],[60,3],[40,4],[20,5],[0,6] ],
  ober:   [ [95,15],[90,14],[85,13],[80,12],[75,11],[70,10],[65,9],[60,8],[55,7],[50,6],[45,5],[40,4],[33,3],[27,2],[20,1],[0,0] ]
};

function getNote(prozent, stufe) {
  const skala = NOTEN[stufe] || NOTEN.mittel;
  for (const [schwelle, note] of skala) {
    if (prozent >= schwelle) return note;
  }
  return stufe === 'ober' ? 0 : 6;
}

// ════════════════════════════════════════════════════════════
//  INITIALISIERUNG
// ════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  // Bereits abgegeben?
  const key = QUIZ_CFG.id + '_' + QUIZ_CFG.klasse;
  if (localStorage.getItem('quiz_done_' + key)) {
    goToStep('step-result');
    document.getElementById('result-loading').style.display = 'none';
    document.getElementById('result-content').innerHTML = '<p style="text-align:center;padding:40px;color:#888;">Du hast dieses Quiz bereits abgegeben. ✓</p>';
    document.getElementById('result-content').style.display = 'block';
    return;
  }

  // Anti-Cheat: Pull-to-Refresh blockieren (nur am oberen Rand nach unten ziehen)
  let touchStartY = 0;
  document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', e => {
    const scrollEl = document.scrollingElement || document.documentElement;
    const ziehtNachUnten = e.touches[0].clientY > touchStartY;
    if (scrollEl.scrollTop <= 0 && ziehtNachUnten && e.cancelable) e.preventDefault();
  }, { passive: false });

  // Anti-Cheat: Copy/Paste
  document.addEventListener('copy', handleCheat);
  document.addEventListener('paste', handleCheat);
  document.addEventListener('cut', handleCheat);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // Anti-Cheat: Tab-Wechsel
  document.addEventListener('visibilitychange', handleVisibility);

  // Fragen mischen
  QUIZ_CFG.abschnitte.forEach(abs => {
    shuffle(abs.fragen);
    abs.fragen.forEach(f => { if (f.optionen) shuffle(f.optionen); });
  });

  // Quiz-UI aufbauen
  buildQuizUI();
  updateJokerUI();
});

// ════════════════════════════════════════════════════════════
//  ANTI-CHEAT
// ════════════════════════════════════════════════════════════
function handleCheat(e) {
  e.preventDefault();
  document.getElementById('cheat-overlay').style.display = 'flex';
}
function closeCheatOverlay() {
  document.getElementById('cheat-overlay').style.display = 'none';
}

function handleVisibility() {
  if (document.hidden) {
    state.tabStart = Date.now();
  } else {
    if (state.tabStart) {
      const dauer = (Date.now() - state.tabStart) / 1000;
      state.tabWechsel++;
      if (dauer > 10) state.tabWechselLang++;
      state.tabStart = null;
    }
  }
}

// ════════════════════════════════════════════════════════════
//  SCHRITT-NAVIGATION
// ════════════════════════════════════════════════════════════
function goToStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); window.scrollTo(0,0); }
}

function onNameSelect() {
  state.name = document.getElementById('name-select').value;
  updateStartBtn();
}
function selectMood(btn, val) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.stimmung = val;
  updateStartBtn();
}
function updateStartBtn() {
  const ok = state.name && state.stimmung;
  document.getElementById('btn-start').disabled = !ok;
}

// ════════════════════════════════════════════════════════════
//  QUIZ STARTEN
// ════════════════════════════════════════════════════════════
function startQuiz() {
  if (!state.name || !state.stimmung) return;

  // Vollbild anfordern
  try { document.documentElement.requestFullscreen(); } catch(e) {}
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) state.fullscreenVerlassen++;
  });

  if (QUIZ_CFG.jokerAktiv) document.getElementById('joker-container').style.display = 'flex';

  if (QUIZ_CFG.timerGesamt > 0) startGesamtTimer(QUIZ_CFG.timerGesamt);

  goToStep('step-abs-intro-0');
}

// ════════════════════════════════════════════════════════════
//  QUIZ UI AUFBAUEN
// ════════════════════════════════════════════════════════════
function buildQuizUI() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let frageNr = 1;

  QUIZ_CFG.abschnitte.forEach((abs, absIdx) => {
    // Abschnitts-Intro
    const intro = document.createElement('div');
    intro.id = `step-abs-intro-${absIdx}`;
    intro.className = 'step';
    intro.innerHTML = `
      <div class="card section-intro-card">
        <div class="section-badge">Abschnitt ${absIdx+1} von ${QUIZ_CFG.abschnitte.length}</div>
        <h2 class="section-title">${esc(abs.titel)}</h2>
        ${abs.beschreibung ? `<p class="section-desc">${esc(abs.beschreibung)}</p>` : ''}
        ${abs.formatHinweis ? `<div class="format-hint"><strong>Aufgabenformat:</strong> ${esc(abs.formatHinweis)}</div>` : ''}
        <button class="btn-main" onclick="startAbschnitt(${absIdx})">Abschnitt starten →</button>
      </div>
    `;
    container.appendChild(intro);

    // Fragen des Abschnitts
    abs.fragen.forEach((frage, frageIdx) => {
      const stepDiv = document.createElement('div');
      stepDiv.id = `step-f-${frage.id}`;
      stepDiv.className = 'step';
      stepDiv.dataset.absIdx = absIdx;
      stepDiv.dataset.frageIdx = frageIdx;
      stepDiv.dataset.frageId = frage.id;

      const gesamtFragen = QUIZ_CFG.abschnitte.reduce((s,a) => s + a.fragen.length, 0);
      const progress = Math.round((frageNr - 1) / gesamtFragen * 100);

      stepDiv.innerHTML = `
        <div class="card question-card">
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div class="question-meta">Frage ${frageNr} von ${gesamtFragen}</div>
          ${QUIZ_CFG.timerAufgabe ? `<div id="atimer-${frage.id}" class="aufgabe-timer"></div>` : ''}
          <div class="question-text">${esc(frage.text)}</div>
          <div class="answer-area" id="area-${frage.id}">
            ${buildAnswerHTML(frage)}
          </div>
          <button class="btn-next" id="btn-next-${frage.id}" onclick="nextFrage(${absIdx}, ${frageIdx})" ${canAdvance(frage) ? '' : 'disabled'}>
            ${isLast(absIdx, frageIdx) ? 'Quiz abschicken ✓' : 'Weiter →'}
          </button>
        </div>
      `;
      container.appendChild(stepDiv);
      frageNr++;
    });
  });
}

function buildAnswerHTML(frage) {
  const fid = frage.id;
  if (frage.typ === 'wahr_falsch') {
    return `
      <div class="wf-row">
        <button class="wf-btn" id="wf-wahr-${fid}" onclick="saveWF('${fid}','wahr')">✓ Wahr</button>
        <button class="wf-btn" id="wf-falsch-${fid}" onclick="saveWF('${fid}','falsch')">✗ Falsch</button>
      </div>
    `;
  }
  if (frage.typ === 'multiple_choice_single') {
    return frage.optionen.map((opt, i) =>
      `<label class="opt-label" id="opt-${fid}-${i}">
        <input type="radio" name="${fid}" value="${i}" onchange="saveMCSingle('${fid}', ${i})">
        <span>${esc(opt.text)}</span>
      </label>`
    ).join('');
  }
  if (frage.typ === 'multiple_choice_multi') {
    return `<p class="multi-hint">Mehrfachauswahl möglich</p>` + frage.optionen.map((opt, i) =>
      `<label class="opt-label" id="opt-${fid}-${i}">
        <input type="checkbox" value="${i}" onchange="saveMCMulti('${fid}', ${i}, this.checked)">
        <span>${esc(opt.text)}</span>
      </label>`
    ).join('');
  }
  if (frage.typ === 'kurzantwort') {
    return `<input type="text" class="kurz-input" id="kurz-${fid}" placeholder="Deine Antwort..." oninput="saveKurz('${fid}', this.value)">`;
  }
  if (frage.typ === 'freitext') {
    return `
      <p class="freitext-be-hint">Bewertung: bis zu ${frage.maxBE} Punkte (Lehrer bewertet)</p>
      <textarea class="freitext-area" id="ft-${fid}" rows="5" placeholder="Deine ausführliche Antwort..." oninput="saveFreitext('${fid}', this.value)"></textarea>
    `;
  }
  return '';
}

function canAdvance(frage) {
  return frage.typ === 'freitext'; // Freitext immer weiter möglich
}

function isLast(absIdx, frageIdx) {
  return absIdx === QUIZ_CFG.abschnitte.length - 1 &&
         frageIdx === QUIZ_CFG.abschnitte[absIdx].fragen.length - 1;
}

// ════════════════════════════════════════════════════════════
//  ANTWORT SPEICHERN
// ════════════════════════════════════════════════════════════
function saveWF(fid, val) {
  state.antworten[fid] = val;
  document.getElementById(`wf-wahr-${fid}`).classList.toggle('selected', val === 'wahr');
  document.getElementById(`wf-falsch-${fid}`).classList.toggle('selected', val === 'falsch');
  enableNextBtn(fid);

  // Joker-Interaktion
  if (state.aktJoker) { /* WF not supported for joker */ state.aktJoker = null; updateJokerUI(); }
}

function saveMCSingle(fid, optIdx) {
  if (handleJokerClick(fid, optIdx, false)) return;
  state.antworten[fid] = optIdx;
  enableNextBtn(fid);
}

function saveMCMulti(fid, optIdx, checked) {
  if (!state.antworten[fid]) state.antworten[fid] = [];
  if (handleJokerClick(fid, optIdx, true)) return;
  if (checked) state.antworten[fid].push(optIdx);
  else state.antworten[fid] = state.antworten[fid].filter(i => i !== optIdx);
  enableNextBtn(fid);
}

function saveKurz(fid, val) {
  state.antworten[fid] = val.trim();
  enableNextBtn(fid);
}

function saveFreitext(fid, val) {
  state.antworten[fid] = val;
}

function enableNextBtn(fid) {
  const btn = document.getElementById(`btn-next-${fid}`);
  if (btn) btn.disabled = false;
}

// ════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════
function startAbschnitt(absIdx) {
  const erste = QUIZ_CFG.abschnitte[absIdx].fragen[0];
  goToStep(`step-f-${erste.id}`);
  if (QUIZ_CFG.timerAufgabe > 0) startAufgabeTimer(erste.id, QUIZ_CFG.timerAufgabe);
}

function nextFrage(absIdx, frageIdx) {
  clearAufgabeTimer();
  if (isLast(absIdx, frageIdx)) {
    submitQuiz();
    return;
  }
  let nextAbs = absIdx, nextFrage = frageIdx + 1;
  if (nextFrage >= QUIZ_CFG.abschnitte[absIdx].fragen.length) {
    nextAbs++;
    goToStep(`step-abs-intro-${nextAbs}`);
    return;
  }
  const naechste = QUIZ_CFG.abschnitte[nextAbs].fragen[nextFrage];
  goToStep(`step-f-${naechste.id}`);
  if (QUIZ_CFG.timerAufgabe > 0) startAufgabeTimer(naechste.id, QUIZ_CFG.timerAufgabe);
}

// ════════════════════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════════════════════
function startGesamtTimer(sekunden) {
  let verbleibend = sekunden;
  const box = document.getElementById('timer-box');
  box.style.display = 'block';
  updateTimerDisplay(box, verbleibend);

  state.timerGesamtLaeuft = setInterval(() => {
    verbleibend--;
    updateTimerDisplay(box, verbleibend);
    if (verbleibend <= 60) box.classList.add('timer-warn');
    if (verbleibend <= 0) {
      clearInterval(state.timerGesamtLaeuft);
      state.zeitAbgelaufen = true;
      submitQuiz(true);
    }
  }, 1000);
}

function startAufgabeTimer(fid, sekunden) {
  let verbleibend = sekunden;
  const el = document.getElementById(`atimer-${fid}`);
  if (!el) return;
  updateAufgabeTimerDisplay(el, verbleibend);

  state.timerAufgabeLaeuft = setInterval(() => {
    verbleibend--;
    updateAufgabeTimerDisplay(el, verbleibend);
    if (verbleibend <= 0) {
      clearAufgabeTimer();
      state.aufgabeTimeout[fid] = true;
      // Auto-weiter
      const stepEl = document.getElementById(`step-f-${fid}`);
      if (stepEl) {
        const absIdx = parseInt(stepEl.dataset.absIdx);
        const frageIdx = parseInt(stepEl.dataset.frageIdx);
        nextFrage(absIdx, frageIdx);
      }
    }
  }, 1000);
}

function clearAufgabeTimer() {
  if (state.timerAufgabeLaeuft) { clearInterval(state.timerAufgabeLaeuft); state.timerAufgabeLaeuft = null; }
}

function updateTimerDisplay(el, sek) {
  const m = Math.floor(sek / 60), s = sek % 60;
  el.textContent = `⏱ ${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateAufgabeTimerDisplay(el, sek) {
  el.textContent = `⏳ ${sek}s`;
  el.style.color = sek <= 10 ? '#c62828' : '';
}

// ════════════════════════════════════════════════════════════
//  JOKER-SYSTEM
// ════════════════════════════════════════════════════════════
function activateJoker(typ) {
  if (state.aktJoker === typ) {
    state.aktJoker = null;
  } else {
    if (typ === 'blitz' && state.jokerBlitz <= 0) return;
    if (typ === 'schwur' && state.jokerSchwur <= 0) return;
    state.aktJoker = typ;
  }
  updateJokerUI();
}

function updateJokerUI() {
  const bEl = document.getElementById('blitz-box');
  const sEl = document.getElementById('schwur-box');
  if (!bEl) return;
  bEl.innerHTML = `⚡ ${state.jokerBlitz}`;
  sEl.innerHTML = `🤞 ${state.jokerSchwur}`;
  bEl.className = state.aktJoker === 'blitz' ? 'joker-active' : (state.jokerBlitz <= 0 ? 'joker-used' : '');
  sEl.className = state.aktJoker === 'schwur' ? 'joker-active' : (state.jokerSchwur <= 0 ? 'joker-used' : '');
}

function handleJokerClick(fid, optIdx, isMulti) {
  if (!state.aktJoker || !QUIZ_CFG.jokerAktiv) return false;
  const frage = findFrage(fid);
  if (!frage || !frage.optionen) return false;

  const opt = frage.optionen[optIdx];
  const jokerTyp = state.aktJoker;
  state.aktJoker = null;

  if (jokerTyp === 'blitz') {
    state.jokerBlitz--;
    const label = document.getElementById(`opt-${fid}-${optIdx}`);
    if (opt.korrekt) {
      if (label) label.classList.add('joker-right');
      if (!isMulti) state.antworten[fid] = optIdx;
      else {
        if (!state.antworten[fid]) state.antworten[fid] = [];
        if (!state.antworten[fid].includes(optIdx)) state.antworten[fid].push(optIdx);
      }
      state.jokerLog.push({ fid, optIdx, typ: 'blitz', ergebnis: 'richtig' });
    } else {
      if (label) { label.classList.add('joker-wrong'); const inp = label.querySelector('input'); if(inp) inp.disabled = true; }
      state.jokerLog.push({ fid, optIdx, typ: 'blitz', ergebnis: 'falsch' });
    }
    enableNextBtn(fid);
  } else if (jokerTyp === 'schwur') {
    // Prüfe ob schon blitz benutzt
    const blitzGenutzt = state.jokerLog.some(j => j.fid === fid && j.typ === 'blitz');
    if (blitzGenutzt) { updateJokerUI(); return false; }

    state.jokerSchwur--;
    // Alle anderen sperren
    frage.optionen.forEach((o, i) => {
      if (i !== optIdx) {
        const lbl = document.getElementById(`opt-${fid}-${i}`);
        if (lbl) { lbl.classList.add('joker-locked'); const inp = lbl.querySelector('input'); if(inp) inp.disabled = true; }
      }
    });
    const label = document.getElementById(`opt-${fid}-${optIdx}`);
    if (label) label.classList.add('joker-sworn');
    if (!isMulti) state.antworten[fid] = optIdx;
    else {
      if (!state.antworten[fid]) state.antworten[fid] = [];
      if (!state.antworten[fid].includes(optIdx)) state.antworten[fid].push(optIdx);
    }
    state.jokerLog.push({ fid, optIdx, typ: 'schwur', korrekt: opt.korrekt });
    enableNextBtn(fid);
  }

  updateJokerUI();
  return true;
}

function findFrage(fid) {
  for (const abs of QUIZ_CFG.abschnitte) {
    const f = abs.fragen.find(f => f.id === fid);
    if (f) return f;
  }
  return null;
}

// ════════════════════════════════════════════════════════════
//  AUSWERTUNG & EINREICHUNG
// ════════════════════════════════════════════════════════════
function submitQuiz(timeout = false) {
  if (state.abgegeben) return;
  state.abgegeben = true;

  clearInterval(state.timerGesamtLaeuft);
  clearAufgabeTimer();
  document.getElementById('timer-box').style.display = 'none';
  document.getElementById('joker-container').style.display = 'none';

  goToStep('step-result');

  const auswertung = berechnePunkte(timeout);
  setTimeout(() => zeigeErgebnis(auswertung), 1200);

  sendeGoogleForm(auswertung, timeout);

  const key = QUIZ_CFG.id + '_' + QUIZ_CFG.klasse;
  localStorage.setItem('quiz_done_' + key, '1');
}

function berechnePunkte(timeout) {
  let maxBE = 0, erreichtBE = 0;
  const details = [];
  const jokerBoni = {};

  // Joker-Bonus/-Malus berechnen
  state.jokerLog.forEach(j => {
    if (j.typ === 'schwur') {
      jokerBoni[j.fid] = j.korrekt ? 2 : -1;
    }
  });

  QUIZ_CFG.abschnitte.forEach(abs => {
    abs.fragen.forEach(frage => {
      const fid = frage.id;
      const ant = state.antworten[fid];
      const istTimeout = state.aufgabeTimeout[fid] && !ant;

      let maxF = 0, erF = 0, korrekt = false, detail = { fid, text: frage.text, typ: frage.typ, timeout: istTimeout };

      if (frage.typ === 'wahr_falsch') {
        maxF = 1;
        korrekt = ant === frage.loesung;
        erF = korrekt ? 1 : 0;
        detail.loesung = frage.loesung;
        detail.antwort = ant || (istTimeout ? 'TIMEOUT' : 'Keine Antwort');
        detail.korrekt = korrekt;

      } else if (frage.typ === 'multiple_choice_single') {
        maxF = 1;
        const korrOpt = frage.optionen.findIndex(o => o.korrekt);
        korrekt = ant === korrOpt;
        erF = korrekt ? 1 : 0;
        detail.loesung = frage.optionen[korrOpt]?.text || '';
        detail.antwort = (ant !== undefined && ant !== null) ? (frage.optionen[ant]?.text || '') : (istTimeout ? 'TIMEOUT' : 'Keine Antwort');
        detail.korrekt = korrekt;

      } else if (frage.typ === 'multiple_choice_multi') {
        const korrekte = frage.optionen.map((o,i) => o.korrekt ? i : -1).filter(i => i >= 0);
        maxF = korrekte.length;
        const gewaehlte = Array.isArray(ant) ? ant : [];
        let pkt = 0;
        gewaehlte.forEach(i => { if (korrekte.includes(i)) pkt++; else pkt--; });
        erF = Math.max(0, pkt);

        // Joker Schwur Bonus
        if (jokerBoni[fid] !== undefined) erF = Math.max(0, erF + jokerBoni[fid]);

        detail.loesung = korrekte.map(i => frage.optionen[i].text).join(', ');
        detail.antwort = gewaehlte.length ? gewaehlte.map(i => frage.optionen[i]?.text || '').join(', ') : (istTimeout ? 'TIMEOUT' : 'Keine Antwort');
        detail.korrekt = erF === maxF;

      } else if (frage.typ === 'kurzantwort') {
        maxF = 1;
        const loesungen = [frage.loesung, ...(frage.alternativloesungen || [])].map(l => l.toLowerCase().trim());
        const gegeben = (ant || '').toLowerCase().trim();
        korrekt = loesungen.includes(gegeben);
        erF = korrekt ? 1 : 0;
        detail.loesung = frage.loesung;
        detail.antwort = ant || (istTimeout ? 'TIMEOUT' : 'Keine Antwort');
        detail.korrekt = korrekt;

      } else if (frage.typ === 'freitext') {
        maxF = frage.maxBE || 0;
        erF = 0; // Lehrer bewertet
        detail.antwort = ant || '';
        detail.musterloesung = frage.musterloesung || '';
        detail.korrekt = null; // unbewertet
      }

      maxBE += maxF;
      erreichtBE += erF;
      detail.maxF = maxF;
      detail.erF = erF;
      details.push(detail);
    });
  });

  const hatFreitext = QUIZ_CFG.abschnitte.some(abs => abs.fragen.some(f => f.typ === 'freitext'));

  const prozent = maxBE > 0 ? Math.round(erreichtBE / maxBE * 100) : 0;
  const note = hatFreitext ? null : getNote(prozent, QUIZ_CFG.stufe);

  // Freischuss
  let noteFreischuss = null;
  if (!hatFreitext && QUIZ_CFG.freischussBE > 0) {
    const korrigiertBE = Math.min(maxBE, erreichtBE + QUIZ_CFG.freischussBE);
    const korrigiertProzent = maxBE > 0 ? Math.round(korrigiertBE / maxBE * 100) : 0;
    noteFreischuss = getNote(korrigiertProzent, QUIZ_CFG.stufe);
  }

  return { maxBE, erreichtBE, prozent, note, noteFreischuss, details, jokerBoni, hatFreitext };
}

function zeigeErgebnis(a) {
  document.getElementById('result-loading').style.display = 'none';
  const content = document.getElementById('result-content');
  content.style.display = 'block';

  // Score
  if (a.hatFreitext) {
    document.getElementById('result-score').innerHTML =
      `<div class="score-num">${a.erreichtBE} / ${a.maxBE} Punkte*</div>
       <div class="score-pct">* ohne die noch nicht bewerteten Freitextaufgaben</div>`;
  } else {
    document.getElementById('result-score').innerHTML =
      `<div class="score-num">${a.erreichtBE} / ${a.maxBE} Punkte</div>
       <div class="score-pct">${a.prozent}%</div>`;
  }

  // Note
  if (a.hatFreitext) {
    document.getElementById('result-note').innerHTML =
      `<div class="note-pending">📝 Deine Note wird angezeigt, sobald dein Lehrer die Freitextaufgabe(n) bewertet hat.</div>`;
  } else {
    const noteLabel = QUIZ_CFG.stufe === 'ober' ? `${a.note} Punkte` : `Note ${a.note}`;
    document.getElementById('result-note').innerHTML = `<div class="note-display">${noteLabel}</div>`;

    // Freischuss
    if (a.noteFreischuss !== null) {
      const fsLabel = QUIZ_CFG.stufe === 'ober' ? `${a.noteFreischuss} Punkte` : `Note ${a.noteFreischuss}`;
      document.getElementById('result-freischuss').innerHTML =
        `<div class="freischuss-hint">Mit Freischuss (+${QUIZ_CFG.freischussBE} BE): <strong>${fsLabel}</strong></div>`;
    }
  }

  // Meme/Bild je Note (nur wenn Note schon feststeht)
  document.getElementById('result-meme').innerHTML = a.hatFreitext ? '' : getMemeHTML(a.note, QUIZ_CFG.stufe, QUIZ_CFG.design);

  // Auflösung
  const aufEl = document.getElementById('result-aufloesung');
  aufEl.innerHTML = '';
  a.details.forEach(d => {
    const div = document.createElement('div');
    div.className = 'aufloesungs-item ' + (d.korrekt === true ? 'item-richtig' : d.korrekt === false ? 'item-falsch' : 'item-manuell');
    let html = `<div class="item-frage">${esc(d.text)}</div>`;

    if (d.typ === 'freitext') {
      html += `<div class="item-antwort">Deine Antwort: ${esc(d.antwort) || '<em>Keine Antwort</em>'}</div>`;
      html += `<div class="item-muster"><strong>Musterlösung:</strong> ${esc(d.musterloesung)}</div>`;
      html += `<div class="item-info">📝 Wird vom Lehrer bewertet (max. ${d.maxF} Punkte)</div>`;
    } else {
      const symbol = d.korrekt ? '✓' : (d.timeout ? '⏱' : '✗');
      html += `<div class="item-antwort">${symbol} Deine Antwort: <strong>${esc(d.antwort)}</strong></div>`;
      if (!d.korrekt) html += `<div class="item-loesung">Richtig wäre: <strong>${esc(d.loesung)}</strong></div>`;
      html += `<div class="item-punkte">${d.erF} / ${d.maxF} Punkte${d.timeout ? ' (Timeout)' : ''}</div>`;
    }
    div.innerHTML = html;
    aufEl.appendChild(div);
  });
}

// ════════════════════════════════════════════════════════════
//  GOOGLE FORMS EINREICHEN
// ════════════════════════════════════════════════════════════
function sendeGoogleForm(auswertung, timeout) {
  const f = QUIZ_CFG.googleForm;
  if (!f || !f.url || f.url.includes('XXXXX')) return;

  let detailText = '';
  auswertung.details.forEach(d => {
    if (d.typ === 'freitext') {
      detailText += `[FREITEXT ${d.fid}] ${d.antwort}\n`;
    } else {
      detailText += `[${d.korrekt ? 'OK' : 'X'} ${d.fid}] Antwort: ${d.antwort} | Richtig: ${d.loesung || '-'} | ${d.erF}/${d.maxF}P\n`;
    }
  });

  const jokerText = state.jokerLog.map(j => `${j.typ}:${j.fid}:${j.ergebnis || (j.korrekt ? 'richtig' : 'falsch')}`).join('; ');

  const felder = {
    [f.felder.name]: state.name,
    [f.felder.klasse]: QUIZ_CFG.klasse,
    [f.felder.fach]: QUIZ_CFG.fach,
    [f.felder.quizId]: QUIZ_CFG.id,
    [f.felder.quizTitel]: QUIZ_CFG.titel,
    [f.felder.stimmung]: state.stimmung,
    [f.felder.punkte]: String(auswertung.erreichtBE),
    [f.felder.maxPunkte]: String(auswertung.maxBE),
    [f.felder.note]: auswertung.hatFreitext ? `ausstehend:${QUIZ_CFG.stufe}` : String(auswertung.note),
    [f.felder.details]: detailText.slice(0, 8000),
    [f.felder.tabFlags]: `Wechsel:${state.tabWechsel}|Lang:${state.tabWechselLang}|FS:${state.fullscreenVerlassen}`,
    [f.felder.jokerDetails]: jokerText || 'keine',
    [f.felder.timeout]: timeout ? 'JA' : 'Nein'
  };

  let iframe = document.getElementById('gf-iframe');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.id = 'gf-iframe'; iframe.name = 'gf-iframe'; iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }

  const form = document.createElement('form');
  form.action = f.url; form.method = 'POST'; form.target = 'gf-iframe';
  Object.entries(felder).forEach(([name, val]) => {
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = name; input.value = val;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(() => document.body.removeChild(form), 2000);
}

// ════════════════════════════════════════════════════════════
//  HILFSFUNKTIONEN
// ════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getMemeHTML(note, stufe, design) {
  const gut = stufe === 'ober' ? note >= 10 : note <= 2;
  const ok = stufe === 'ober' ? note >= 6 : note <= 4;
  if (design === 'comic') {
    if (gut) return '<div class="meme-comic gut">💥 MEGA! 💥</div>';
    if (ok) return '<div class="meme-comic ok">👍 Gut gemacht!</div>';
    return '<div class="meme-comic schlecht">💪 Weiter üben!</div>';
  }
  if (design === 'study') {
    if (gut) return '<div class="meme-study">🌟 Hervorragend! Dein Einsatz zahlt sich aus.</div>';
    if (ok) return '<div class="meme-study">📚 Solide! Mit etwas mehr Übung klappt es noch besser.</div>';
    return '<div class="meme-study">🔄 Nicht aufgeben – Wiederholung ist der Schlüssel!</div>';
  }
  // apple
  if (gut) return '<div class="meme-apple">Ausgezeichnet ✦</div>';
  if (ok) return '<div class="meme-apple">Gut gemacht</div>';
  return '<div class="meme-apple">Weiter so</div>';
}
