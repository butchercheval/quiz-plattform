<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz-Plattform</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 20px; padding: 40px 32px; max-width: 400px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
h1 { font-size: 1.5em; color: #1d1d1f; margin-bottom: 8px; }
p { color: #888; font-size: 0.9em; margin-bottom: 28px; }
a.tile { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border: 1px solid #eee; border-radius: 14px; margin-bottom: 12px; text-decoration: none; color: #1d1d1f; transition: all 0.15s; text-align: left; }
a.tile:hover { border-color: #0071e3; background: #f8faff; }
.tile-icon { font-size: 1.6em; }
.tile-title { font-weight: 600; font-size: 0.95em; }
.tile-sub { font-size: 0.78em; color: #888; }
.hint { font-size: 0.75em; color: #bbb; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>📚 Quiz-Plattform</h1>
  <p>Wähle deinen Bereich</p>

  <a class="tile" href="dashboard.html">
    <span class="tile-icon">📊</span>
    <span>
      <span class="tile-title">Meine Ergebnisse</span><br>
      <span class="tile-sub">Für Schülerinnen und Schüler</span>
    </span>
  </a>

  <a class="tile" href="admin.html">
    <span class="tile-icon">🔑</span>
    <span>
      <span class="tile-title">Lehrer-Dashboard</span><br>
      <span class="tile-sub">Ergebnisse, Klassen, Auswertung</span>
    </span>
  </a>

  <div class="hint">Quizze sind nur über den QR-Code / direkten Link erreichbar.</div>
</div>
</body>
</html>
